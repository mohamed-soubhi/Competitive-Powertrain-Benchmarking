[project]
name = "powerbench"
version = "0.1.0"
description = "Competitive Powertrain Benchmarking Dashboard — EU HDV CO2 mining, EDA, ML, Streamlit."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scikit-learn==1.5.2",
    "plotly==5.24.1",
    "pydantic==2.9.2",
    "PyYAML==6.0.2",
    "requests==2.32.3",
    "tenacity==9.0.0",
    "duckdb==1.1.3",
    "pyarrow==18.0.0",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
]
app = [
    "streamlit>=1.57",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["powerbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
